<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450">
  <defs>
    <!-- Background styling -->
    <style>
      .bg { fill: #0d1117; } /* matches github dark exactly */
      .sidebar { fill: #161b22; }
      .header { fill: #161b22; border-bottom: 1px solid #30363d; }
      .border { fill: none; stroke: #30363d; stroke-width: 1; }
      
      /* Typography */
      .code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 14px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; }
      
      /* Syntax Highlight Colors (One Dark / GitHub Dark) */
      .keyword { fill: #ff7b72; } /* red */
      .variable { fill: #79c0ff; } /* blue */
      .string { fill: #a5d6ff; } /* light blue */
      .comment { fill: #8b949e; } /* gray */
      .method { fill: #d2a8ff; } /* purple */
      .operator { fill: #c9d1d9; } /* text white */
      
      /* Typing Animation Classes */
      .line { opacity: 0; animation: reveal 0.1s forwards; }
      @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
    </style>
  </defs>

  <!-- Container -->
  <rect class="bg" width="900" height="450" rx="6" />
  <rect class="sidebar" x="0" y="0" width="180" height="450" rx="6" />
  <rect class="sidebar" x="180" y="0" width="6" height="450" />
  <rect class="bg" x="180" y="0" width="720" height="450" /> 
  <rect class="border" width="900" height="450" rx="6" />
  
  <!-- Header / Window Controls -->
  <rect class="header" x="0" y="0" width="900" height="35" rx="6" />
  <rect class="header" x="0" y="20" width="900" height="15" />
  
  <circle cx="20" cy="17" r="6" fill="#ff5f56" />
  <circle cx="40" cy="17" r="6" fill="#ffbd2e" />
  <circle cx="60" cy="17" r="6" fill="#27c93f" />
  
  <text x="450" y="22" class="title" text-anchor="middle">PaulJohnnn - Visual Studio Code</text>

  <!-- Sidebar File Explorer -->
  <text x="15" y="60" class="title" font-weight="bold" fill="#c9d1d9">EXPLORER</text>
  <text x="15" y="85" class="title">❯ PaulJohnnn</text>
  <text x="30" y="110" class="title" fill="#c9d1d9">≡ README.md</text>
  <text x="30" y="130" class="title" fill="#79c0ff">{} about.json</text>
  <text x="30" y="150" class="title" fill="#d2a8ff">TS profile.ts</text>
  
  <!-- Main Editor Tab -->
  <rect x="180" y="35" width="140" height="30" fill="#0d1117" />
  <rect x="180" y="35" width="1" height="30" fill="#30363d" />
  <rect x="320" y="35" width="1" height="30" fill="#30363d" />
  <text x="210" y="55" class="title" fill="#c9d1d9">profile.ts</text>
  <rect x="180" y="65" width="720" height="1" fill="#30363d" />
  
  <!-- Line Numbers -->
  <g class="title" text-anchor="end" transform="translate(210, 0)">
    <text y="90">1</text>
    <text y="110">2</text>
    <text y="130">3</text>
    <text y="150">4</text>
    <text y="170">5</text>
    <text y="190">6</text>
    <text y="210">7</text>
    <text y="230">8</text>
    <text y="250">9</text>
    <text y="270">10</text>
    <text y="290">11</text>
    <text y="310">12</text>
    <text y="330">13</text>
    <text y="350">14</text>
    <text y="370">15</text>
    <text y="390">16</text>
    <text y="410">17</text>
  </g>

  <!-- Code Content -->
  <g class="code" transform="translate(230, 0)">
    <text y="90" class="comment">// Welcome to my GitHub Profile!</text>

    <!-- Code Block Developer -->
    <text y="130" class="line" style="animation-delay: 0.1s;">
        <tspan class="keyword">const</tspan> <tspan class="variable">developer</tspan> <tspan class="operator">=</tspan> <tspan class="operator">{</tspan>
    </text>
    
    <text y="150" class="line" style="animation-delay: 0.3s;">
        <tspan class="operator">   </tspan><tspan class="keyword">name</tspan><tspan class="operator">:</tspan> <tspan class="string">'Paul John Palamara'</tspan><tspan class="operator">,</tspan>
    </text>

    <text y="170" class="line" style="animation-delay: 0.5s;">
        <tspan class="operator">   </tspan><tspan class="keyword">role</tspan><tspan class="operator">:</tspan> <tspan class="string">'Software Engineer'</tspan><tspan class="operator">,</tspan>
    </text>
    
    <text y="190" class="line" style="animation-delay: 0.7s;">
        <tspan class="operator">   </tspan><tspan class="method">languages</tspan><tspan class="operator">: [</tspan><tspan class="string">'TS/JS'</tspan><tspan class="operator">, </tspan><tspan class="string">'Python'</tspan><tspan class="operator">, </tspan><tspan class="string">'Java'</tspan><tspan class="operator">, </tspan><tspan class="string">'PHP'</tspan><tspan class="operator">, </tspan><tspan class="string">'SQL'</tspan><tspan class="operator">],</tspan>
    </text>

    <text y="210" class="line" style="animation-delay: 0.9s;">
        <tspan class="operator">   </tspan><tspan class="method">technologies</tspan><tspan class="operator">: [</tspan><tspan class="string">'React'</tspan><tspan class="operator">, </tspan><tspan class="string">'Next.js'</tspan><tspan class="operator">, </tspan><tspan class="string">'Docker'</tspan><tspan class="operator">, </tspan><tspan class="string">'Supabase'</tspan><tspan class="operator">]</tspan>
    </text>

    <text y="230" class="line" style="animation-delay: 1.1s;">
        <tspan class="operator">};</tspan>
    </text>

    <!-- Code Block Coursework -->
    <text y="270" class="line" style="animation-delay: 1.3s;">
        <tspan class="keyword">function</tspan> <tspan class="method">exploreAcademics</tspan><tspan class="operator">() {</tspan>
    </text>
    
    <text y="290" class="line" style="animation-delay: 1.5s;">
        <tspan class="operator">   </tspan><tspan class="keyword">return</tspan> <tspan class="operator">{</tspan>
    </text>

    <text y="310" class="line" style="animation-delay: 1.7s;">
        <tspan class="operator">     </tspan><tspan class="keyword">coursework</tspan><tspan class="operator">:</tspan> <tspan class="operator">[</tspan>
    </text>
    
    <text y="330" class="line" style="animation-delay: 1.9s;">
        <tspan class="operator">       </tspan><tspan class="string">"Data Structures &amp; Algorithms"</tspan><tspan class="operator">,</tspan>
    </text>
    
    <text y="350" class="line" style="animation-delay: 2.1s;">
        <tspan class="operator">       </tspan><tspan class="string">"Database Systems &amp; Software Engineering"</tspan><tspan class="operator">,</tspan>
    </text>
    
    <text y="370" class="line" style="animation-delay: 2.3s;">
        <tspan class="operator">       </tspan><tspan class="string">"Cloud Computing"</tspan>
    </text>

    <text y="390" class="line" style="animation-delay: 2.5s;">
        <tspan class="operator">     </tspan><tspan class="operator">]</tspan>
    </text>
    
    <text y="410" class="line" style="animation-delay: 2.7s;">
        <tspan class="operator">   };</tspan>
    </text>

    <text y="410" class="line" style="animation-delay: 2.8s;" dx="30">
      <tspan class="operator">_</tspan>
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    </text>

  </g>
</svg>
