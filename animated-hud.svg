<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
    <defs>
        <!-- Glow filter -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3.5" result="blur" />
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <!-- Grid Pattern -->
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222736" stroke-width="1" />
        </pattern>
        <!-- Gradient -->
        <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f0ff" />
            <stop offset="100%" stop-color="#ff003c" />
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect width="900" height="400" fill="#090B10" rx="15" />
    <rect width="900" height="400" fill="url(#grid)" rx="15" />
    
    <!-- Outer Border Glow -->
    <rect x="5" y="5" width="890" height="390" fill="none" stroke="url(#cyber-grad)" stroke-width="2" rx="10" opacity="0.5" />

    <style>
        .text-title { font-family: 'Courier New', monospace; font-size: 32px; font-weight: bold; fill: #00f0ff; filter: url(#glow); }
        .text-body { font-family: 'Courier New', monospace; font-size: 16px; fill: #bac2de; }
        .hacker-text { font-family: 'Courier New', monospace; font-size: 14px; fill: #ff003c; opacity: 0.8; }
        .tech-badge { font-family: 'Courier New', monospace; font-size: 14px; fill: #ffbd2e; font-weight: 600; filter: url(#glow); }
    </style>

    <!-- Scanline effect: an animated low-opacity bar moving top to bottom -->
    <rect width="900" height="15" fill="#00f0ff" opacity="0.05">
        <animate attributeName="y" values="-20;420" dur="4s" repeatCount="indefinite" />
    </rect>

    <!-- Left Avatar / Graphic Section -->
    <g transform="translate(180, 200)">
        <!-- Rotating Outer Dashed Circle -->
        <circle cx="0" cy="0" r="110" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="10 20">
            <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="25s" repeatCount="indefinite" />
        </circle>
        
        <!-- Rotating Inner Dashed Circle Reverse -->
        <circle cx="0" cy="0" r="85" fill="none" stroke="#ff003c" stroke-width="3" stroke-dasharray="25 15 5 15">
            <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="15s" repeatCount="indefinite" />
        </circle>

        <!-- Inner solid glowing circle -->
        <circle cx="0" cy="0" r="70" fill="#090B10" stroke="url(#cyber-grad)" stroke-width="2" filter="url(#glow)"/>
        
        <!-- Center Initial -->
        <text x="0" y="32" font-size="100" font-family="sans-serif" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#glow)">P</text>
        <text x="0" y="32" font-size="100" font-family="sans-serif" font-weight="900" fill="none" stroke="#00f0ff" stroke-width="2" text-anchor="middle">P</text>
    </g>

    <!-- Right Content Section -->
    <g transform="translate(360, 70)">
        <!-- Small blinking cursor element -->
        <text x="0" y="0" class="hacker-text">&lt;sys.user.profile /&gt;</text>
        <rect x="180" y="-12" width="8" height="15" fill="#ff003c" opacity="0.8">
            <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite" />
        </rect>

        <text x="0" y="40" class="text-title">Paul John Palamara</text>
        <text x="0" y="75" class="text-body" fill="#00f0ff" font-weight="bold">Software Engineer &amp; Web Architect</text>
        
        <!-- Simulated Terminal Box -->
        <rect x="0" y="100" width="480" height="150" fill="#05070b" stroke="#00f0ff" stroke-width="1" rx="8" opacity="0.85" />
        
        <text x="20" y="130" class="text-body">
            <tspan fill="#ff003c">admin@system</tspan><tspan fill="#bac2de">:~# </tspan><tspan fill="#00f0ff">cat</tspan> about.txt
        </text>
        <!-- The text fields can be easily modified later -->
        <text x="20" y="155" class="text-body">Building the future of the web with robust</text>
        <text x="20" y="180" class="text-body">architectures and stunning user interfaces.</text>

        <text x="20" y="215" class="text-body">
            <tspan fill="#ff003c">admin@system</tspan><tspan fill="#bac2de">:~# </tspan><tspan fill="#00f0ff">docker ps</tspan> grep tech_stack
        </text>
        <text x="20" y="240" class="tech-badge">
            ReactJS   Next.js   TypeScript   Node.js   Python
        </text>
    </g>
    
    <!-- Cyber Decals -->
    <g transform="translate(850, 30)">
        <rect x="0" y="0" width="20" height="5" fill="#00f0ff" filter="url(#glow)"/>
        <rect x="5" y="15" width="15" height="2" fill="#ff003c" />
        <rect x="5" y="25" width="15" height="2" fill="#ff003c" />
        <rect x="12" y="35" width="8" height="2" fill="#ff003c" />
    </g>

    <text x="15" y="380" class="hacker-text" font-size="11">SYS.STATUS: ONLINE | LATENCY: 8MS | UPLINK: ENCRYPTED</text>
</svg>
